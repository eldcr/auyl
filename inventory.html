<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Ресторанный склад · инвентаризация</title>
    
    <!-- Font Awesome (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- External CSS file from root -->
    <link rel="stylesheet" href="style.css">
    
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* ============================================================
           Additional styles for weight calculation field
           ============================================================ */
        
        /* Row layout with weight calculator */
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #f5f5f5;
            transition: all 0.25s ease;
            border-radius: 4px;
            /* DEFAULT: pale red */
            background: #fff5f5;
            border-left: 3px solid #f0d0d0;
        }
        
        .item-row:last-child {
            border-bottom: none;
        }
        
        .item-row:hover {
            background: #fff0f0;
        }
        
        /* ============================================================
           HIGHLIGHT STATES
           ============================================================ */
        
        /* 1. When product name is selected (clicked/focused) - slight grey */
        .item-name.selected {
            background: #f0f0f0;
            border-radius: 4px;
            padding: 0.1rem 0.3rem;
            margin: -0.1rem -0.3rem;
            transition: background 0.2s ease;
        }
        
        /* 2. AFTER = button is pressed - turn green */
        .item-row.calculated {
            background: #f0faf0;
            border-left: 3px solid #81c784;
        }
        
        .item-row.calculated:hover {
            background: #e8f5e9;
        }
        
        /* 3. When expression field is focused */
        .weight-expr-input:focus {
            outline: none;
            border-color: #b88b66;
            box-shadow: 0 0 0 3px rgba(184, 139, 102, 0.15);
        }
        
        /* 4. Result box states */
        .weight-result-box.has-result {
            background: #e8f5e9;
            border-color: #81c784;
            color: #2e7d32;
        }
        
        .weight-result-box.has-result.error {
            background: #ffebee;
            border-color: #ef9a9a;
            color: #c62828;
        }
        
        .item-name {
            font-weight: 400;
            font-size: 0.85rem;
            color: #1a1a1a;
            flex: 1;
            min-width: 140px;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            transition: background 0.2s ease;
            cursor: default;
        }
        
        .item-name .item-unit-badge {
            background: rgba(0,0,0,0.06);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 500;
            color: #888;
            margin-left: 0.4rem;
        }
        
        /* Weight calculator group */
        .weight-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            touch-action: manipulation;
        }
        
        .weight-expr-input {
            width: 100px;
            padding: 0.35rem 0.6rem;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: monospace;
            background: white;
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s ease;
        }
        
        .weight-expr-input:focus {
            outline: none;
            border-color: #b88b66;
            box-shadow: 0 0 0 3px rgba(184, 139, 102, 0.15);
        }
        
        .weight-expr-input::placeholder {
            color: #bbb;
            font-size: 0.75rem;
        }
        
        .weight-calc-btn {
            background: #1a1a1a;
            border: none;
            border-radius: 8px;
            padding: 0.35rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: white;
            transition: all 0.15s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            min-width: 44px;
            justify-content: center;
        }
        
        .weight-calc-btn:hover {
            background: #2a2a2a;
        }
        
        .weight-calc-btn:active {
            transform: scale(0.96);
        }
        
        .weight-result-box {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: monospace;
            min-width: 50px;
            text-align: center;
            color: #1a1a1a;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            transition: all 0.2s ease;
        }
        
        /* Responsive */
        @media (max-width: 680px) {
            .item-row {
                padding: 0.5rem 0.6rem;
                gap: 0.4rem;
            }
            .item-name {
                font-size: 0.8rem;
                min-width: 100px;
                flex: 1 1 100%;
            }
            .weight-group {
                flex: 1 1 100%;
                justify-content: flex-start;
            }
            .weight-expr-input {
                width: 80px;
                font-size: 0.8rem;
                padding: 0.3rem 0.4rem;
            }
            .weight-calc-btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.75rem;
                min-width: 38px;
            }
            .weight-result-box {
                font-size: 0.8rem;
                min-width: 40px;
                padding: 0.3rem 0.5rem;
                min-height: 32px;
            }
        }
        
        @media (max-width: 400px) {
            .weight-group {
                gap: 0.3rem;
            }
            .weight-expr-input {
                width: 65px;
                font-size: 0.75rem;
                padding: 0.25rem 0.3rem;
            }
            .weight-calc-btn {
                font-size: 0.7rem;
                padding: 0.25rem 0.6rem;
                min-width: 34px;
            }
            .weight-result-box {
                font-size: 0.75rem;
                min-width: 35px;
                padding: 0.25rem 0.4rem;
                min-height: 28px;
            }
        }
    </style>
</head>
<body>
<div class="main-container">
    
    <!-- Header -->
    <div class="brand">
        <h1><i class="fas fa-warehouse"></i> Ресторанный склад</h1>
        <div class="subhead">
            <i class="fas fa-calculator"></i> 
            Введите выражение (например, <strong>1+1</strong> или <strong>0,5+0,75</strong>) · нажмите <i class="fas fa-equals"></i>
        </div>
    </div>
    
    <!-- Inventory -->
    <div id="inventoryContainer"></div>
    
    <!-- Action Bar -->
    <div class="action-bar">
        <div class="left-actions">
            <button class="btn btn-primary" id="addRowBtn"><i class="fas fa-plus"></i> Добавить товар</button>
            <button class="btn btn-outline" id="resetAllBtn"><i class="fas fa-trash-alt"></i> Сбросить всё</button>
        </div>
        <button class="btn btn-success" id="exportExcelBtn"><i class="fas fa-file-excel"></i> Export .xlsx</button>
    </div>
    
    <!-- Copy Field -->
    <div class="copy-field-area">
        <div class="copy-field-header">
            <h3>📋 Результаты <span>(скопируйте или экспортируйте)</span></h3>
            <div class="copy-actions">
                <button class="btn-copy" id="copyToClipboardBtn"><i class="fas fa-copy"></i> Копировать</button>
                <button class="btn btn-outline" id="refreshCopyBtn" style="padding:0.3rem 0.9rem;font-size:0.7rem;">Обновить</button>
            </div>
        </div>
        <div class="copy-field" id="copyField">// Результаты появятся здесь</div>
    </div>
    
    <footer>
        <div class="developer-credit">
            Ресторанный склад · инвентаризация
        </div>
    </footer>
</div>

<script>
    (function() {
        // ============================================================
        // DATA — products by category
        // ============================================================
        const productData = {
            "Товар": {
                unit: "Кг",
                items: [
                    "Грибы начинка",
                    "Джусай начинка",
                    "Дрожжи",
                    "Зира дешевая",
                    "Кефир",
                    "Кориандр",
                    "Кумин",
                    "Кунжут белый",
                    "Манитоба мука",
                    "Мука В/С",
                    "Оливковое масло",
                    "Растительное масло",
                    "Сливочное масло Президент",
                    "Сметана домашняя",
                    "Соль",
                    "Цельнозерновая мука",
                    "Черный перец молотый"
                ]
            },
            "Полуфабрикаты": {
                unit: "Кг",
                items: [
                    "Батат п/ф",
                    "Бауырсак тесто п/ф",
                    "Беш тесто п/ф",
                    "Желток п/ф",
                    "Конина начинка п/ф",
                    "Куриное филе п/ф",
                    "Лапша п/Ф",
                    "Манты п/ф",
                    "Манты тесто п/ф",
                    "Самса батат п/ф",
                    "Самса грибы п/ф",
                    "Самса конина п/ф",
                    "Самса тесто п/ф",
                    "Тесто самса п/ф",
                    "Тушпара начинка п/ф",
                    "Тушпара п/ф",
                    "Тушпара тесто п/ф",
                    "Тыква резанный п/ф",
                    "Шпинат начинка готовый п/ф",
                    "Грибная начинка с мозгом п/ф",
                    "Грибная начинка база п/ф"
                ]
            },
            "Дополнительно": {
                unit: "Кг",
                items: []
            }
        };
        
        // ============================================================
        // STATE
        // ============================================================
        let rowCounter = 0;
        const container = document.getElementById('inventoryContainer');
        const copyField = document.getElementById('copyField');
        
        // orderMap: rowId -> { name, expr, result, calculated }
        let orderMap = new Map();
        
        // ============================================================
        // HELPERS
        // ============================================================
        function evaluateExpression(expr) {
            if (!expr || expr.trim() === '') return NaN;
            const sanitized = expr.replace(/,/g, '.');
            if (!/^[\d+\-*/().\s]+$/.test(sanitized)) return NaN;
            try {
                const result = new Function(`return (${sanitized})`)();
                if (typeof result !== 'number' || !isFinite(result)) return NaN;
                return result;
            } catch (_) {
                return NaN;
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }
        
        // ============================================================
        // CREATE ROW — pale red default, green after calculation
        // ============================================================
        function createRow(productName = '', expression = '', resultValue = '', unit = 'Кг') {
            const rowId = ++rowCounter;
            const row = document.createElement('div');
            row.className = 'item-row';
            row.dataset.rowId = rowId;
            // Default: pale red (applied via CSS)
            
            // Product name with click handler for selection highlight
            const nameDiv = document.createElement('div');
            nameDiv.className = 'item-name';
            nameDiv.innerHTML = `${escapeHtml(productName)} <span class="item-unit-badge">${escapeHtml(unit)}</span>`;
            
            // Click on product name to highlight it (slight grey)
            nameDiv.addEventListener('click', function(e) {
                document.querySelectorAll('.item-name').forEach(el => {
                    el.classList.remove('selected');
                });
                this.classList.add('selected');
            });
            
            // Weight calculator group
            const weightGroup = document.createElement('div');
            weightGroup.className = 'weight-group';
            
            // Expression input
            const exprInput = document.createElement('input');
            exprInput.type = 'text';
            exprInput.placeholder = '1+1';
            exprInput.value = expression;
            exprInput.className = 'weight-expr-input';
            
            // Calculate button (=)
            const calcBtn = document.createElement('button');
            calcBtn.className = 'weight-calc-btn';
            calcBtn.innerHTML = '<i class="fas fa-equals"></i>';
            calcBtn.type = 'button';
            calcBtn.setAttribute('aria-label', 'Calculate');
            
            // Result display
            const resultSpan = document.createElement('span');
            resultSpan.className = 'weight-result-box';
            let displayVal = resultValue;
            if (displayVal === '' && expression.trim() !== '') {
                const computed = evaluateExpression(expression);
                displayVal = (!isNaN(computed) && isFinite(computed)) ? computed.toString().replace('.', ',') : '?';
            } else if (displayVal === '' || displayVal === undefined) {
                displayVal = '0';
            }
            resultSpan.textContent = displayVal;
            
            // Set initial result class
            updateResultClass(resultSpan);
            
            // Assemble
            weightGroup.appendChild(exprInput);
            weightGroup.appendChild(calcBtn);
            weightGroup.appendChild(resultSpan);
            
            row.appendChild(nameDiv);
            row.appendChild(weightGroup);
            
            // ============================================================
            // UPDATE HIGHLIGHT STATES
            // ============================================================
            let isCalculated = false;
            
            function updateRowHighlights() {
                const result = resultSpan.textContent;
                const hasValidResult = result !== '0' && result !== '' && result !== 'err';
                
                // If calculated and has valid result -> green
                if (isCalculated && hasValidResult) {
                    row.classList.add('calculated');
                    row.classList.remove('has-value');
                } else {
                    row.classList.remove('calculated');
                    // Keep pale red (default)
                }
                
                // Result box highlight
                updateResultClass(resultSpan);
            }
            
            function updateResultClass(resultSpan) {
                const result = resultSpan.textContent;
                if (result === 'err') {
                    resultSpan.classList.add('has-result', 'error');
                    resultSpan.classList.remove('has-result');
                } else if (result !== '0' && result !== '') {
                    resultSpan.classList.add('has-result');
                    resultSpan.classList.remove('error');
                } else {
                    resultSpan.classList.remove('has-result', 'error');
                }
            }
            
            // ----- Events -----
            calcBtn.addEventListener('click', function() {
                const expr = exprInput.value.trim();
                if (expr === '') {
                    resultSpan.textContent = '0';
                    isCalculated = false;
                    orderMap.set(rowId, { 
                        name: productName, 
                        expr: expr, 
                        result: '0',
                        calculated: false,
                        unit: unit
                    });
                    updateRowHighlights();
                    updateAll();
                    return;
                }
                const result = evaluateExpression(expr);
                if (isNaN(result) || !isFinite(result)) {
                    resultSpan.textContent = 'err';
                    isCalculated = true;
                } else {
                    const formatted = result.toString().replace('.', ',');
                    resultSpan.textContent = formatted;
                    isCalculated = true;
                }
                orderMap.set(rowId, { 
                    name: productName, 
                    expr: exprInput.value.trim(), 
                    result: resultSpan.textContent,
                    calculated: isCalculated,
                    unit: unit
                });
                updateRowHighlights();
                updateAll();
            });
            
            // Update on Enter key
            exprInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    calcBtn.click();
                }
            });
            
            // When user types in expression, keep pale red (don't auto-calculate)
            exprInput.addEventListener('input', function() {
                const expr = exprInput.value.trim();
                // If user clears the expression, reset calculated state
                if (expr === '') {
                    isCalculated = false;
                    resultSpan.textContent = '0';
                    row.classList.remove('calculated');
                } else {
                    // Keep pale red until = is pressed
                    row.classList.remove('calculated');
                }
                orderMap.set(rowId, { 
                    name: productName, 
                    expr: expr, 
                    result: resultSpan.textContent,
                    calculated: isCalculated,
                    unit: unit
                });
                updateRowHighlights();
                updateAll();
            });
            
            // Also update highlights when result changes from other interactions
            const observer = new MutationObserver(function() {
                updateRowHighlights();
            });
            observer.observe(resultSpan, { childList: true, characterData: true, subtree: true });
            
            // Store initial
            orderMap.set(rowId, { 
                name: productName, 
                expr: exprInput.value.trim(), 
                result: resultSpan.textContent,
                calculated: false,
                unit: unit
            });
            
            // Initial highlight update
            setTimeout(updateRowHighlights, 10);
            
            return row;
        }
        
        // ============================================================
        // RENDER ALL
        // ============================================================
        function renderAll() {
            container.innerHTML = '';
            orderMap.clear();
            rowCounter = 0;
            
            for (const [categoryName, category] of Object.entries(productData)) {
                if (category.items.length === 0) continue;
                
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const header = document.createElement('div');
                header.className = 'category-header';
                const iconMap = {
                    'Товар': '📦',
                    'Полуфабрикаты': '🥩',
                    'Дополнительно': '➕'
                };
                header.innerHTML = `
                    <span>${iconMap[categoryName] || '📋'}</span> 
                    ${categoryName}
                    <span class="category-unit">${category.unit}</span>
                `;
                section.appendChild(header);
                
                const grid = document.createElement('div');
                grid.className = 'items-grid';
                
                category.items.forEach(itemName => {
                    const row = createRow(itemName, '', '0', category.unit);
                    grid.appendChild(row);
                });
                
                section.appendChild(grid);
                container.appendChild(section);
            }
            
            // If no rows, add one empty
            if (container.querySelectorAll('.item-row').length === 0) {
                const row = createRow('', '', '0', 'Кг');
                container.appendChild(row);
            }
            
            setTimeout(updateAll, 50);
        }
        
        // ============================================================
        // UPDATE ALL FIELDS
        // ============================================================
        function updateAll() {
            const rows = container.querySelectorAll('.item-row');
            let allLines = [];
            let totalItems = 0;
            
            rows.forEach(row => {
                const rowId = parseInt(row.dataset.rowId);
                const nameDiv = row.querySelector('.item-name');
                const exprInput = row.querySelector('.weight-expr-input');
                const resultSpan = row.querySelector('.weight-result-box');
                
                const name = nameDiv ? nameDiv.textContent.replace(/\s*Кг$/, '').trim() : 'unnamed';
                const expr = exprInput ? exprInput.value.trim() : '';
                const result = resultSpan ? resultSpan.textContent : '0';
                
                if (rowId) {
                    const existing = orderMap.get(rowId) || {};
                    orderMap.set(rowId, { 
                        name, 
                        expr, 
                        result, 
                        calculated: existing.calculated || false,
                        unit: 'Кг' 
                    });
                }
                
                const numericResult = parseFloat(result.replace(',', '.'));
                if (expr || (numericResult > 0 && !isNaN(numericResult))) {
                    totalItems++;
                    const displayResult = (result && result !== 'err') ? result : '0';
                    allLines.push(`${name}: ${displayResult} кг`);
                }
            });
            
            if (allLines.length === 0) {
                copyField.textContent = '// Нет выбранных товаров';
            } else {
                const dateStr = new Date().toLocaleDateString('ru-RU');
                copyField.textContent = `📋 Результаты инвентаризации\n${dateStr}\n───────────────────\n${allLines.join('\n')}\n───────────────────\n✅ Позиций: ${allLines.length}`;
            }
        }
        
        // ============================================================
        // EXPORT TO EXCEL
        // ============================================================
        function exportToExcel() {
            const rows = container.querySelectorAll('.item-row');
            if (rows.length === 0) {
                showToast('Нет товаров для экспорта');
                return;
            }
            
            const data = [['Продукт', 'Выражение', 'Результат (кг)']];
            let hasData = false;
            
            rows.forEach(row => {
                const nameDiv = row.querySelector('.item-name');
                const exprInput = row.querySelector('.weight-expr-input');
                const resultSpan = row.querySelector('.weight-result-box');
                
                const name = nameDiv ? nameDiv.textContent.replace(/\s*Кг$/, '').trim() : 'unnamed';
                const expr = exprInput ? exprInput.value.trim() : '';
                const result = resultSpan ? resultSpan.textContent : '0';
                
                data.push([name, expr, result]);
                if (name !== 'unnamed' || expr || result !== '0') hasData = true;
            });
            
            if (!hasData) {
                showToast('Нет данных для экспорта');
                return;
            }
            
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Инвентаризация');
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            link.download = `склад-${dateStr}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('✅ Excel экспортирован');
        }
        
        // ============================================================
        // COPY TO CLIPBOARD
        // ============================================================
        function copyToClipboard() {
            const text = copyField.textContent;
            if (!text || text.includes('Нет выбранных')) {
                showToast('Нет данных для копирования');
                return;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ Скопировано!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✅ Скопировано!');
            });
        }
        
        // ============================================================
        // RESET ALL
        // ============================================================
        function resetAll() {
            const rows = container.querySelectorAll('.item-row');
            rows.forEach(row => {
                const exprInput = row.querySelector('.weight-expr-input');
                const resultSpan = row.querySelector('.weight-result-box');
                if (exprInput) exprInput.value = '';
                if (resultSpan) resultSpan.textContent = '0';
                // Remove green highlight, return to pale red
                row.classList.remove('calculated');
                if (resultSpan) {
                    resultSpan.classList.remove('has-result', 'error');
                }
            });
            orderMap.clear();
            updateAll();
            showToast('Все позиции сброшены');
        }
        
        // ============================================================
        // ADD ROW
        // ============================================================
        function addRow() {
            const row = createRow('Новый товар', '', '0', 'Кг');
            container.appendChild(row);
            updateAll();
            const exprInput = row.querySelector('.weight-expr-input');
            if (exprInput) setTimeout(() => exprInput.focus(), 50);
            showToast('✅ Товар добавлен');
        }
        
        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout = null;
        function showToast(msg) {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = msg;
            document.body.appendChild(toast);
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.remove(), 2500);
        }
        
        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.getElementById('addRowBtn').addEventListener('click', addRow);
        document.getElementById('resetAllBtn').addEventListener('click', resetAll);
        document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
        document.getElementById('copyToClipboardBtn').addEventListener('click', copyToClipboard);
        document.getElementById('refreshCopyBtn').addEventListener('click', updateAll);
        
        // ============================================================
        // INIT
        // ============================================================
        renderAll();
        
    })();
</script>
</body>
